[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

# BSC Testnet
[rpc_endpoints]
bsc-testnet = "https://data-seed-prebsc-1-s1.binance.org:8545/"
bsc-mainnet = "https://bsc-dataseed.binance.org/"

