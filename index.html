      // Fix for Chrome extensions attempting to assign window.fetch when it only has a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          
          // Define a writable property with both getter and setter on window
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(newFetch) {
              originalFetch = newFetch;
            }
          });

          // Also patch Window.prototype if it exists and lacks a setter
          if (window.Window && window.Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              Object.defineProperty(window.Window.prototype, 'fetch', {
                configurable: true,
                enumerable: protoDesc.enumerable,
                get: protoDesc.get,
                set: function(val) {
                  originalFetch = val;
                }
              });
            }
          }
        } catch (e) {
          // Fallback if property definition is restricted
        }

        // Suppress unhandled errors originating from external chrome extensions
        window.addEventListener('error', function(event) {
          if (
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
             event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault && event.preventDefault();
            event.stopPropagation && event.stopPropagation();
          }
        }, true);
      })();
